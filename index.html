<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhereDid I Put</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a1a1f;
            --surface: #212127;
            --border: #2e2e38;
            --text: #e8e8f0;
            --muted: #7a7a90;
            --accent: #a78bfa;
            --accent2: #60a5fa;
            --glow: rgba(167, 139, 250, 0.15);
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle background noise texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(167, 139, 250, 0.07) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(96, 165, 250, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            position: relative;
            z-index: 1;
        }

        /* ── App Icon ── */
        .icon-wrap {
            margin-bottom: 36px;
            opacity: 0;
            animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }

        .app-icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            background: linear-gradient(145deg, #2a2a35, #1e1e28);
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(167, 139, 250, 0.12),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            position: relative;
            overflow: hidden;
        }

        .app-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.08) 0%, transparent 60%);
        }

        /* ── Title ── */
        .title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1;
            text-align: center;
            opacity: 0;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
        }

        .title .word1 {
            color: var(--text);
        }

        .title .word2 {
            color: var(--text);
        }

        .title .word3 {
            font-style: italic;
            background: linear-gradient(90deg, #f1c40f, #3f3303);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Tagline ── */
        .tagline {
            margin-top: 20px;
            font-size: 1rem;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.02em;
            text-align: center;
            max-width: 280px;
            line-height: 1.6;
            opacity: 0;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
        }

        /* ── Divider ── */
        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 32px auto;
            opacity: 0;
            animation: rise 1s ease 0.55s forwards;
        }

        /* ── App Store Button ── */
        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 20px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
            cursor: pointer;
        }

        .store-btn:hover {
            border-color: rgba(167, 139, 250, 0.4);
            box-shadow: 0 4px 30px var(--glow);
            transform: translateY(-2px);
        }

        .store-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text);
            flex-shrink: 0;
        }

        .store-btn-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .store-btn-sub {
            font-size: 0.68rem;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .store-btn-main {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* ── Features row ── */
        .features {
            display: flex;
            gap: 24px;
            margin-top: 48px;
            opacity: 0;
            animation: rise 1s ease 0.8s forwards;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feat {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 300;
        }

        .feat-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
            flex-shrink: 0;
        }

        /* ── Animation ── */
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Footer ── */
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.72rem;
            color: rgba(122, 122, 144, 0.4);
            letter-spacing: 0.04em;
        }
    </style>
</head>

<body>
    <div class="page">

        <div class="icon-wrap">
            <div class="app-icon">🔍</div>
        </div>

        <h1 class="title">
            <span class="word1">where</span><span class="word2">did</span><span class="word3">put</span>
        </h1>

        <p class="tagline">لن تنسى أين وضعت أغراضك مرة أخرى</p>

        <div class="divider"></div>

        <a href="#" class="store-btn">
            <!-- Apple logo SVG -->
            <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 71 0 130.2 46.7 174.4 46.7 42.7 0 109.2-49.9 190.5-49.9 30.8 0 108.2 2.6 168.9 80.8zm-234.5-135.2c32-48.6 54.7-116.5 54.7-184.4 0-9.4-.6-18.9-2-27.7-51.8 1.9-113.5 34.5-149.6 85.2-29 41-54.1 109.5-54.1 176.4 0 10.3 1.3 20.7 2.1 23.7 3.4.5 8.9 1.3 14.4 1.3 45.6 0 102.9-30.7 134.5-74.5z" />
            </svg>
            <div class="store-btn-text">
                <span class="store-btn-main">App Store</span>
            </div>
        </a>

        <div class="features">
            <div class="feat"><span class="feat-dot"></span>سريع وبسيط</div>
            <div class="feat"><span class="feat-dot"></span>يعمل بدون إنترنت</div>
            <div class="feat"><span class="feat-dot"></span>خصوصيتك محفوظة</div>
        </div>

    </div>

    <div class="footer">By k10</div>
</body>

</html>
